{% extends "auctions/layout.html" %}

{% block body %}

    <h2>Create a Listing</h2>

    <form action="{% url 'listing' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Title:</label>
            <input autofocus class="form-control" type="text" id="title" name="title" placeholder="Title" required>
        </div>
        <div class="form-group">
            <label for="description">Description:</label>
            <input class="form-control" type="text" id="description" name="description" placeholder="Description" required>
        </div>
        <div class="form-group">
            <label for="bid">Starting Bid:</label>
            <div class="input-group">
                <div class="input-group-prepend">
                    <span class="input-group-text">$</span>
                </div>
                <input class="form-control" type="number" id="bid" name="bid" placeholder="Starting bid" required>
            </div>
        </div>
        <div class="form-group">
            <label for="imagen">Image:</label>
            <input class="form-control" type="text" id="imagen" name="imagen" placeholder="URL de la imagen">
        </div>
        <div class="form-group">
            <label for="category_name">Choose a category:</label>
            <select id="category_name" name="category_name" required>
                <option value="" disabled selected>Choose a category</option>
                <option value="Toys">Toys</option>
                <option value="Fashion">Fashion</option>
                <option value="Electronic Devices">Electronic Devices</option>
                <option value="Furniture">Furniture</option>
            </select>
        </div>
        <input class="btn btn-primary" type="submit" value="Create">
    </form>

{% endblock %}
